<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">Language support and localization roadmap</title><desc id="d">Turkish interface, Turkish and English speech selection, automatic detection, and proposed additional languages.</desc>
<rect width="1200" height="340" rx="26" fill="#081523"/><text x="48" y="55" fill="#f4f8ff" font-family="Arial" font-size="27" font-weight="700">LANGUAGE SUPPORT</text><text x="48" y="83" fill="#9eb4cc" font-family="Arial" font-size="15">Current speech-language options vs. proposed localization expansion</text>
<g font-family="Arial"><rect x="48" y="115" width="340" height="170" rx="18" fill="#132b40" stroke="#35d6c5"/><text x="75" y="153" fill="#73e4d7" font-size="18" font-weight="700">AVAILABLE IN v1.2</text><text x="75" y="197" fill="#f4f8ff" font-size="25">🇹🇷 Turkish</text><text x="75" y="230" fill="#f4f8ff" font-size="25">🇬🇧 English</text><text x="75" y="263" fill="#b8c9dc" font-size="17">🌐 Automatic speech detection</text>
<rect x="430" y="115" width="722" height="170" rx="18" fill="#172642" stroke="#8174d8"/><text x="458" y="153" fill="#b9adff" font-size="18" font-weight="700">PROPOSED FUTURE LANGUAGES</text><g fill="#f4f8ff" font-size="23"><text x="458" y="203">🇪🇸 Español</text><text x="680" y="203">🇫🇷 Français</text><text x="900" y="203">🇩🇪 Deutsch</text><text x="458" y="250">🇸🇦 العربية</text><text x="680" y="250">🇵🇹 Português</text><text x="900" y="250">🇨🇳 中文</text></g><text x="600" y="320" text-anchor="middle" fill="#8fa8c3" font-size="14">Speech-language selection is not the same as interface localization.</text></g></svg>