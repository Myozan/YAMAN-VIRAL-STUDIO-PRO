<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Video production pipeline</title><desc id="d">Five stages: source, transcription, AI selection, editing, export</desc><defs><linearGradient id="p" x1="0" x2="1"><stop stop-color="#22c9b8"/><stop offset="1" stop-color="#8b72f8"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="#0b1726"/><text x="52" y="55" fill="#f0f6ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">CONTENT PIPELINE</text><path d="M130 150H1070" stroke="url(#p)" stroke-width="5" stroke-linecap="round"/><g font-family="Arial,sans-serif" text-anchor="middle"><g><circle cx="130" cy="150" r="43" fill="#12384a" stroke="#36d6c4" stroke-width="3"/><text x="130" y="158" fill="#8ff5e7" font-size="25" font-weight="700">01</text><text x="130" y="225" fill="#f2f6ff" font-size="19" font-weight="700">KAYNAK</text><text x="130" y="250" fill="#9eb3cb" font-size="14">YouTube / Video</text></g><g><circle cx="365" cy="150" r="43" fill="#12384a" stroke="#36d6c4" stroke-width="3"/><text x="365" y="158" fill="#8ff5e7" font-size="25" font-weight="700">02</text><text x="365" y="225" fill="#f2f6ff" font-size="19" font-weight="700">TRANSKRİPSİYON</text><text x="365" y="250" fill="#9eb3cb" font-size="14">Whisper / Zaman damgası</text></g><g><circle cx="600" cy="150" r="43" fill="#25264a" stroke="#8b72f8" stroke-width="3"/><text x="600" y="158" fill="#c7bbff" font-size="25" font-weight="700">03</text><text x="600" y="225" fill="#f2f6ff" font-size="19" font-weight="700">AKILLI SEÇİM</text><text x="600" y="250" fill="#9eb3cb" font-size="14">Ollama / Puanlama</text></g><g><circle cx="835" cy="150" r="43" fill="#25264a" stroke="#8b72f8" stroke-width="3"/><text x="835" y="158" fill="#c7bbff" font-size="25" font-weight="700">04</text><text x="835" y="225" fill="#f2f6ff" font-size="19" font-weight="700">KURGU</text><text x="835" y="250" fill="#9eb3cb" font-size="