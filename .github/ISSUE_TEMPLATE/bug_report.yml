name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please remove tokens, personal data and private media paths from all logs."
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: "v1.5.2 or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows 11, Python 3.12, GPU model (if relevant)"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ... 2. ... 3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
    validations:
      required: false
