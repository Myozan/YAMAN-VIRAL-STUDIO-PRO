name: Python and frontend quality
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall -q app
      - name: Run unit and API integration tests
        run: python -m pytest -q
      - name: Validate frontend assets
        run: |
          test -s web/index.html
          test -s web/style.css
          test -s web/app.js
          test -s web/sw.js
          test -s web/manifest.webmanifest
          test -s web/icons/icon-192.svg
          test -s web/icons/icon-512.svg
          test -s docs/assets/favicon.svg
          test -s docs/assets/hero.svg
          test -s docs/assets/dashboard-desktop.svg
          test -s docs/assets/dashboard-mobile.svg
          test -s docs/assets/social-preview.svg
          test -s docs/assets/social-preview.png
          test -s docs/assets/screenshot-live-desktop.png
          test -s docs/assets/screenshot-live-mobile.png
          test -s docs/assets/showcase-demo.gif
          test -s docs/assets/showcase-demo.mp4
          test -s docs/SHOWCASE.md
          test -s docs/DEMO.md
          test -s docs/assets/demo-input.mp4
          test -s docs/assets/demo-output-youtube-shorts.mp4
          test -s docs/assets/demo-render-frame.png
          test -s docs/assets/demo-story-flow.mp4
          test -s docs/assets/demo-story-flow-frame.png
          test -s docs/assets/demo-transcript.srt
          grep -q 'WrapStyle: 0' app/main.py
          grep -q 'story_beats' app/main.py
          grep -q 'fallback_story_moments' app/main.py
          grep -q 'summaryFormat' web/index.html
          grep -q 'summaryFormat' web/app.js
          grep -q 'documentary' app/main.py
          grep -q 'education' app/main.py
          grep -q 'product' app/main.py
          grep -q 'value="documentary"' web/index.html
          grep -q 'value="education"' web/index.html
          grep -q 'value="product"' web/index.html
          grep -q 'documentary_video.mp4' app/main.py
          grep -q 'education_video.mp4' app/main.py
          grep -q 'product_video.mp4' app/main.py
          python -c "import json; json.load(open('web/manifest.webmanifest', encoding='utf-8'))"
      - name: Validate JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/sw.js
