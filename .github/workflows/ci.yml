name: Python syntax and frontend checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q app
      - name: Validate frontend assets
        run: |
          test -s web/index.html
          test -s web/style.css
          test -s web/app.js
          test -s web/sw.js
          test -s web/manifest.webmanifest
          test -s web/icons/icon-192.svg
          test -s web/icons/icon-512.svg
          test -s docs/assets/favicon.svg
          python -c "import json; json.load(open('web/manifest.webmanifest', encoding='utf-8'))"
      - name: Validate JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/sw.js
